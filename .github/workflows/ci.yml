name: Python Analysis & DSP CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**.py'
      - 'requirements.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Smoke Test Python Pipeline
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt || pip install pyserial matplotlib numpy

      - name: Syntax and critical lint check (flake8)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Compile Python sources
        run: |
          python -m py_compile src/analysis.py

      - name: Headless Smoke Test for Plot & DSP Pipeline
        run: |
          python - << 'EOF'
          import os
          import sys
          sys.path.insert(0, os.path.abspath("src"))
          import analysis

          synthetic_records = []
          for i in range(100):
              t_ms = float(i * 2.4)
              ax, ay, az = 0.1, 0.2, 1.0 + (2.0 if 40 <= i <= 60 else 0.0)
              gx, gy, gz = 10.0, 20.0, (250.0 if 40 <= i <= 60 else 5.0)
              a_mag = (ax**2 + ay**2 + az**2) ** 0.5
              synthetic_records.append([t_ms, ax, ay, az, gx, gy, gz, a_mag])

          analysis.plot(synthetic_records, analysis.CSV_BEFORE, analysis.FIG_BEFORE, "CI Before")
          analysis.plot(synthetic_records, analysis.CSV_AFTER, analysis.FIG_AFTER, "CI After")

          if hasattr(analysis, "process_dsp"):
              analysis.process_dsp(synthetic_records)
          elif hasattr(analysis, "save_and_plot_dsp"):
              synthetic_dsp = [[r[0], r[7]**2 * 20, 1 if (r[7]**2 * 20) > 25.0 else 0] for r in synthetic_records]
              analysis.save_and_plot_dsp(synthetic_dsp)

          assert os.path.exists(analysis.CSV_BEFORE), "Missing data_before.csv"
          assert os.path.exists(analysis.CSV_AFTER), "Missing data_after.csv"
          assert os.path.exists(analysis.CSV_ENERGY), "Missing energy.csv"
          assert os.path.exists(analysis.CSV_THRS), "Missing threshhold.csv"
          assert os.path.exists(analysis.FIG_AFTER), "Missing plot_after.png"
          assert os.path.exists(analysis.FIG_ENERGY), "Missing energy.png"
          assert os.path.exists(analysis.FIG_THRS), "Missing threshhold.png"
          print("All CSV and Figure outputs verified successfully!")
          EOF

      - name: Upload generated test plots as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-plots
          path: |
            data/*.csv
            figures/*.png
