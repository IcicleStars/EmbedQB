name: Secret Scanning & Security Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Scan for Leaked Secrets & Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for tracked .env or sensitive key files
        run: |
          echo "Checking git index for accidentally committed secret files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|secrets\.json$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "Error: Sensitive files are tracked in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No forbidden secret files detected in repository."

  dependency-audit:
    name: Audit Python Dependencies for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install and run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt || pip install pyserial matplotlib numpy
          pip-audit --desc on || true
